# CI (docs/plans/step-07.md section 4, reviewer decisions B2/B3, docs/DECISIONS.md D35).
#   test        Node 22 LTS, postgres:17 service, Playwright Chromium from the lockfile, typecheck,
#               the full npm test; the full log is uploaded on every run, pass or fail.
#   unit-node25 the pure unit tests (no browser, no Postgres) on Node 25, the builder's local Node.
#   docker      builds the fleet image (build only, never pushed), with the GitHub Actions build cache,
#               so a broken Dockerfile fails fast.
# Not in CI (README "CI"): the Day-1 exit, chaos and the crash-point matrix. They need the Compose
# stack or minutes of wall time; they run as scripts with committed evidence.
name: ci

on:
  push:
    branches: ["main", "fleet/**"]
  pull_request:
    branches: ["main", "fleet/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rote
          POSTGRES_PASSWORD: rote_dev_only
          POSTGRES_DB: rote
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U rote -d rote" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      ROTE_TEST_DATABASE_URL: postgres://rote:rote_dev_only@127.0.0.1:55432/rote_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --version && npm --version
      - run: npm ci
      # The playwright package installed by npm ci (package-lock.json) decides the browser build.
      - run: npx playwright --version
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: npm test (full log kept)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-log
          path: npm-test.txt
          if-no-files-found: warn

  unit-node25:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
      - run: node --version
      - run: npm ci
      - name: unit tests (unit-db project without the *.db.test.ts files; no browser, no Postgres)
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --project unit-db --exclude "**/*.db.test.ts" 2>&1 | tee unit-node25.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-node25-log
          path: unit-node25.txt
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the fleet image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rote-fleet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
